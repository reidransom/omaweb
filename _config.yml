title: Omarchy
description: >-
  Omarchy is an omakase Linux distribution based on Arch, Hyprland, and
  Quickshell, with strong defaults and the freedom to make the computer yours.
url: "https://omaweb.pages.dev"
baseurl: ""
lang: en
localization:
  default_language: en
  locales:
    en:
      tag: en
      label: English
      weight: 1
    da:
      tag: da-DK
      label: Dansk
      weight: 2
      fallbacks: [en]
    fr:
      tag: fr-FR
      label: Français
      weight: 3
      fallbacks: [en]
  required_translations: [da, fr]
permalink: pretty
social_image: /assets/images/opengraph.png
allow_indexing: true
social_image_alt: Omarchy wordmark on a dark background
umami:
  host_url: "https://mtrx.r2ware.dev"
  website_id: "16e0a1aa-0d68-4b96-a646-c4ef83c0c9a1"


features:
  laseretch_wordmark: false

collections:
  news:
    output: true
    permalink: /news/:year/:month/:title/
  manual:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: news
    values:
      layout: article
      archetype: editorial

include:
  - .well-known

exclude:
  - .agents
  - .gitignore
  - .scratch
  - .servd.toml
  - AGENTS.md
  - BRAND.md
  - mise.lock
  - mise.toml
  - README.md
  - _docs
  - _plans
  - _site
  - .site-dev
  - _site.jigyll-localized-backup
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - skills-lock.json
  - src
