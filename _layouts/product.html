---
layout: default
---
<article class="content-shell content-shell--product" data-archetype="product">
  <div class="page-hero">
    {% include status-label.html status=page.status %}
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}
      <p class="page-hero__lede">{{ page.description | escape }}</p>
    {% endif %}
  </div>

  <div class="content-body">
    {{ content }}
  </div>
</article>
