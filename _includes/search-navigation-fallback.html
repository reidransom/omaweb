<ul class="site-search__fallback-menu" role="list">
  {% for section in navigation.sections %}
    <li>
      <details>
        <summary>{{ section.label | escape }}</summary>
        <ul class="site-search__fallback-submenu" role="list">
          {% for link in section.links.items %}
            <li>{% include authoritative-link.html link=link %}</li>
          {% endfor %}
        </ul>
      </details>
    </li>
  {% endfor %}
</ul>
