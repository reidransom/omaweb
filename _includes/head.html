<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1A1B26">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="frame-src https://luma.com">
{% if site.allow_indexing == false %}<meta name="robots" content="noindex">{% elsif page.robots %}<meta name="robots" content="{{ page.robots | escape }}">{% endif %}
{% if page.redirect_to %}<meta http-equiv="refresh" content="{{ page.redirect_delay | default: 0 }};url={{ page.redirect_to | escape }}">{% endif %}
<link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
<link rel="preload" href="{{ '/assets/fonts/jetbrains-mono-light.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if site.umami.website_id %}
<script defer src="{{ '/assets/js/umami.js' | relative_url }}" data-website-id="{{ site.umami.website_id | escape }}" data-host-url="{{ site.umami.host_url | escape }}" data-domains="omaweb.pages.dev" data-do-not-track="true"></script>
{% endif %}
<script>
  if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const root = document.documentElement;
    const siteBundle = new URL("{{ '/assets/js/site.js' | relative_url }}", document.baseURI).href;
    root.classList.add("wordmark-pending");
    window.addEventListener("error", event => {
      if (event.target instanceof HTMLScriptElement && event.target.src === siteBundle) {
        root.classList.remove("wordmark-pending");
      }
    }, true);
  }
</script>
{% include seo.html %}
