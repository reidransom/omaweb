{% assign project_paths = site.data.home.project_paths %}
<section class="home-section home-section--reading home-section--storm" aria-labelledby="project-paths-title">
  <div class="home-section__inner">
    <h2 id="project-paths-title">{{ project_paths.title | escape }}</h2>
    <ul class="home-card-grid home-card-grid--three" role="list">
      {% for path in project_paths.items %}
        <li class="home-card">
          <a class="home-card__link" href="{{ path.url | relative_url }}">
            <h3>{{ path.title | escape }}</h3>
            <p>{{ path.body | escape }}</p>
            <span aria-hidden="true">Explore →</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
