{% assign destinations = site.data.destinations.items %}
{% assign iso = destinations | where: "slug", "iso" | first %}
{% assign manual = destinations | where: "slug", "manual" | first %}
<div class="button-group" aria-label="Desktop actions" markdown="0">
{% if iso %}
<a class="button" href="{{ iso.url }}" rel="noreferrer">Get The ISO</a>
{% endif %}
{% if manual %}
<a class="button button--secondary" href="{{ manual.url }}" rel="noreferrer">Read The Manual</a>
{% endif %}
</div>
