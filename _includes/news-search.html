<section class="news-search" aria-labelledby="news-search-title">
  <h2 id="news-search-title">Search the news</h2>
  <form data-news-search-form data-pagefind-url="{{ '/pagefind/pagefind.js' | relative_url }}" action="{{ '/news/search/' | relative_url }}" method="get">
    <label for="news-search-query">Search stories</label>
    <input id="news-search-query" name="q" type="search" autocomplete="off">
    <button class="button" type="submit">Search</button>
  </form>
  <div data-news-search-results aria-live="polite"></div>
  <noscript>
    <p>Search needs JavaScript. You can still browse every story in the <a href="{{ '/news/' | relative_url }}#archive">full archive</a> or by category above.</p>
  </noscript>
</section>
