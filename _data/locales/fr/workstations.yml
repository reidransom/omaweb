empty_state:
  title: Les postes de travail de la communauté attendent des photos approuvées.
  body: Nous ne disposons pas encore d’une photo locale et approuvée d’un poste de travail de la communauté à publier. Envoyez une photo à l’équipe sur Discord en l’autorisant à l’afficher ici ; cette page doit grandir avec de vrais bureaux, pas des images de stock.
  action_label: Partager un poste de travail sur Discord
