empty_state:
  title: Fællesskabets arbejdsstationer venter på godkendte fotografier.
  body: Vi har endnu ikke et lokalt, godkendt fotografi af en arbejdsstation fra fællesskabet, som vi kan udgive. Send holdet et foto på Discord med tilladelse til at vise det her; siden skal vokse med rigtige skriveborde, ikke arkivbilleder.
  action_label: Del en arbejdsstation på Discord
