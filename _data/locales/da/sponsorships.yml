items:
  hyprland:
    level: Eksklusiv
    summary: Den fliseopdelende Wayland-compositor i hjertet af Omarchy og en af dets tre kerneteknologier.
    term: Tre år med mulighed for yderligere to.
  quickshell:
    summary: Værktøjssættet til skrivebordet, som bruges til Omarchy-skallen, herunder bjælken, menuer, notifikationer, OSD'er og låseskærmen.
    term: Tre år.
  mise:
    summary: Værktøjet, Omarchy bruger til at håndtere sprog-runtimes og distribuere CLI'er til kodeagenter som stubs, der indlæses efter behov.
