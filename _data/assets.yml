schema_version: 1

policy:
  source_originals_root: __docs/images/
  rendered_assets_root: assets/images/
  publication_rule: >-
    Only records whose publication_status is cleared may be emitted below
    assets/images/ or referenced by a rendered page.
  derivative_rule: >-
    scripts/build-assets is the sole generator for listed image derivatives.
    It never overwrites source originals and refuses to render blocked records.
  font_rule: >-
    A font face may be added under assets/fonts/ only after this manifest records
    its cleared official local source, license, SHA-256, face metadata, and
    exact required-wordmark glyph coverage. Full, unsubsetted upstream faces
    must be identified as such rather than represented as subsets.

