schema_version: 1

policy:
  source_originals_root: __docs/images/
  rendered_assets_root: assets/images/
  publication_rule: >-
    Only records whose publication_status is cleared may be emitted below
    assets/images/ or referenced by a rendered page.
  derivative_rule: >-
    scripts/build-assets is the sole generator for the listed image and font
    derivatives. It never overwrites source originals and checks generated
    outputs byte-for-byte with --check.
  font_rule: >-
    Each local JetBrains Mono face is a deterministic subset of its recorded
    official source. Every subset retains the Latin coverage used by this site
    and the wordmark block glyphs.

