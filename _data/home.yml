desktop:
  eyebrow: The Desktop
  title: A computer you can use before you tune it.
  body: Omarchy is an omakase Linux distribution based on Arch, Hyprland, and Quickshell. It starts with a tiling desktop, terminal-first tools, and a coherent visual system instead of a pile of choices.
  actions:
    items:
      - label: Get The ISO
        navigation_label: ISO
      - label: Read The Manual
        navigation_label: Manual

actions:
  title: The parts that make it yours.
  intro: Start from the source of truth. Install from the ISO, learn the system in the Manual, extend it with community Plugins, or inspect the Code.
  items:
    - label: The Manual
      detail: Configuration, applications, and the everyday shortcuts in one place.
      navigation_label: Manual
    - label: The ISO
      detail: The install image for the current desktop.
      navigation_label: ISO
    - label: The Plugins
      detail: Community additions live at their own authoritative directory.
      navigation_label: Plugins
    - label: The Code
      detail: Read the source, follow the changes, and make a contribution.
      navigation_label: Code

workflows:
  eyebrow: Agents, with receipts
  title: Change the computer. Keep the controls.
  intro: An agent is useful when it works on a real seam in the system, not when it waves at a black box.
  items:
    - title: Pick an agent, not a lock-in
      body: Omarchy wires major coding-agent CLIs as lazy-loaded launchers. Nothing is downloaded until you choose to use it.
    - title: Set the default, then call it
      body: Choose a default agent and launch it with Super + Shift + Ctrl + A. Or start a focused task with the omarchy agent prompt command.
    - title: Use the experimental skill carefully
      body: The experimental Omarchy Skill can tweak Hyprland configuration, adjust the bar, or create a theme. Inspect each applied change; the system stays yours.

