expansion:
  eyebrow: Explorations
  title: The desktop is real. The next surfaces are questions.
  body: Omarchy can grow into more kinds of computers and services. The ideas below are explorations, not a release calendar, compatibility promise, or product announcement.

hardware:
  items:
    - title: Laptops
      body: What would useful certification, repairability, tested hardware, and availability look like?
      url: /laptops/
      status: exploratory
    - title: Workstations
      body: See the current community setups that give the desktop its many forms.
      url: /workstations/

server_apps:
  items:
    - title: Server
      body: Explore an opinionated base for self-hosting, workloads, remote administration, and agent-managed infrastructure.
      url: /server/
      status: exploratory
    - title: Apps
      body: Explore first-party applications with shared visual and keyboard conventions, distinct from community plugins.
      url: /apps/
      status: exploratory

cloud_mobile:
  items:
    - title: Cloud
      body: Explore hosted workstations, persistent agents, synchronization, compute, security, and data ownership.
      url: /cloud/
      status: exploratory
    - title: Mobile
      body: Explore a companion for notifications, shared clipboard and files, authentication, remote commands, and device sync.
      url: /mobile/
      status: exploratory

labs:
  title: Labs
  body: "A public place for experiments: new interfaces, agent workflows, alternative devices, voice control, ambient computing, and work from Artists in Residence. Experiments are not products."
  url: /labs/
  status: exploratory

